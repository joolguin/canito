<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Un regalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: 'Pixelify Sans', 'Courier New', monospace;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }

  #app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- vida de la caja (estilo enemigo de Undertale) ---------- */
  #hud {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    letter-spacing: 1px;
    height: 20px;
    opacity: 0;
    transition: opacity .4s;
  }
  #hud.on { opacity: 1; }
  #hud .lbl { white-space: nowrap; }
  #bar {
    flex: 1;
    height: 14px;
    background: #3d0000;
    border: 2px solid #000;
    position: relative;
    max-width: 170px;
  }
  #barfill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 100%;
    background: #2ee02e;
    transition: width .12s steps(4);
  }
  #count { font-size: 15px; white-space: nowrap; }

  /* ---------- escena ---------- */
  #scene {
    width: 100%;
    aspect-ratio: 320 / 172;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  /* ---------- caja de diálogo ---------- */
  #box {
    border: 5px solid #fff;
    background: #000;
    padding: 18px 16px 16px;
    min-height: 148px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ---------- menú de decisión ---------- */
  #menu { display: flex; gap: 12px; width: 100%; margin-top: 16px; }
  #menu[hidden] { display: none; }
  .opt {
    flex: 1;
    background: #000;
    border: 3px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 13px 4px;
    cursor: pointer;
  }
  .opt:active, .opt.sel { border-color: #ffdd00; color: #ffdd00; }

  #txt {
    font-size: 21px;
    line-height: 1.55;
    letter-spacing: .5px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- botón de sonido ---------- */
  #snd {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 8px);
    right: 10px;
    background: none;
    border: none;
    color: #666;
    font-family: inherit;
    font-size: 17px;
    padding: 8px 10px;
    cursor: pointer;
    z-index: 10;
  }
  #snd:active { color: #fff; }

  #tap { position: fixed; inset: 0; z-index: 5; cursor: pointer; }

  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }

  @media (max-height: 700px) {
    #txt { font-size: 18px; }
    #box { min-height: 128px; padding: 14px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <span class="lbl">REGALO</span>
    <div id="bar"><div id="barfill"></div></div>
    <span id="count">HP 31 / 31</span>
  </div>

  <canvas id="scene" width="320" height="172"></canvas>

  <div id="box">
    <div id="txt"></div>
    <div id="menu" hidden></div>
  </div>
</div>

<button id="snd" aria-label="Sonido">♪ ON</button>
<div id="flash"></div>
<div id="tap"></div>
